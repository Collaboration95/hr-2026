<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plotline: code sorter</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

const MODEL = (() => {
// Truth module for the code sorter (Fig 3). Everything the figure counts, shows or reads comes from here.
//

const CODE_COUNT = 20;
const UNKNOWN = 0;
const WATER = 1;
const LAND = 2;
const YEARS = [2021, 2022, 2023, 2024, 2025];
const STATE_NAMES = ["non-forest", "forest", "forest state unknown"];

// land_code(forest_state, post_year_index): forest_state 0/1/2 = non-forest / forest / unknown, post 0 = none, 1..5 = 2021..2025
const landCode = (state, post) => LAND + 6 * state + post;

// eudr-decision.v1 forgets the loss year on JRC 2020 non-forest land: codes 3..7 fold into code 2.
const decisionCode = (code) => (code > LAND && code < LAND + 6 ? LAND : code);
const BLANKED = [3, 4, 5, 6, 7];

// A cell is { kind: "unknown" | "water" | "land", state, post }. This is what the sorter reads off the token.
function codeOf(cell) {
  if (cell.kind === "unknown") return UNKNOWN;
  if (cell.kind === "water") return WATER;
  return decisionCode(landCode(cell.state, cell.post));
}

// Plain words for a code, for the readout.
function describe(code) {
  if (code === UNKNOWN) return "unknown";
  if (code === WATER) return "water";
  const state = Math.floor((code - LAND) / 6);
  const post = (code - LAND) % 6;
  const name = ["non-forest", "forest", "forest state unknown"][state];
  return post ? `${name}, lost ${YEARS[post - 1]}` : name;
}

// The reducer: the 20-bin histogram plus the out-of-chip count becomes the answer. Same layout and same
function summarize(counts, outside = 0) {
  if (counts.length !== CODE_COUNT) throw new Error("code histogram accounting mismatch");
  const [, water, n0, n1, n2, n3, n4, n5, f0, f1, f2, f3, f4, f5, u0, u1, u2, u3, u4, u5] = counts;
  const lost = f1 + f2 + f3 + f4 + f5;
  const funkLost = u1 + u2 + u3 + u4 + u5;
  const forest = f0 + lost;
  const nonforest = n0 + n1 + n2 + n3 + n4 + n5;
  const funk = u0 + funkLost;
  const land = nonforest + forest + funk;
  const unknown = outside + counts[0];
  return {
    land,
    water,
    unknown,
    forest, // Q1: cells that were forest on 31 Dec 2020
    nonforest,
    funk,
    lost, // Q2: of those, cells lost since
    byYear: [f1, f2, f3, f4, f5],
    standing: f0,
    forestPresent: forest > 0 ? true : unknown + funk === 0 ? false : null,
    lostPresent: lost > 0 ? true : unknown + funkLost === 0 ? false : null,
  };
}

const emptyCounts = () => Array(CODE_COUNT).fill(0);
const histogram = (codes) => {
  const counts = emptyCounts();
  for (const code of codes) counts[code] += 1;
  return counts;
};

// ---- Cohorts ------------------------------------------------------------------------------------------------
// Synthetic plot: an invented 7 x 6 block of cells, scanned row by row the way the selector scans a plot.
//   w water, u unknown, - non-forest, a..e non-forest with Hansen loss 2021..2025 (the year is forgotten),
//   F forest in 2020, 1..5 forest in 2020 lost 2021..2025, ? forest state unknown, x forest state unknown lost 2022.
const SYNTHETIC_RASTER = ["ww-a--F", "--1FFFF", "-uFF2F3", "-bFF2F4", "--F?F4F", "c--FxF5"];

const SYMBOLS = {
  w: { kind: "water" },
  u: { kind: "unknown" },
  "-": { kind: "land", state: 0, post: 0 },
  a: { kind: "land", state: 0, post: 1 },
  b: { kind: "land", state: 0, post: 2 },
  c: { kind: "land", state: 0, post: 3 },
  d: { kind: "land", state: 0, post: 4 },
  e: { kind: "land", state: 0, post: 5 },
  F: { kind: "land", state: 1, post: 0 },
  1: { kind: "land", state: 1, post: 1 },
  2: { kind: "land", state: 1, post: 2 },
  3: { kind: "land", state: 1, post: 3 },
  4: { kind: "land", state: 1, post: 4 },
  5: { kind: "land", state: 1, post: 5 },
  "?": { kind: "land", state: 2, post: 0 },
  x: { kind: "land", state: 2, post: 2 },
};

const fromRaster = (rows) => rows.join("").split("").map((symbol) => ({ ...SYMBOLS[symbol] }));
const repeat = (cell, times) => Array.from({ length: times }, () => ({ ...cell }));

// 121 cells, 60 of them JRC 2020 forest, 2 of those lost in 2022; its other 36 loss cells from 2022 were on
// land JRC did not map as forest. The remaining 25 cells carry no loss (121 = 60 + 36 + 25; the support is
// the answer depends on the histogram alone.
const P0001 = [
  ...repeat(SYMBOLS.b, 36),
  ...repeat(SYMBOLS["-"], 25),
  ...repeat(SYMBOLS.F, 58),
  ...repeat(SYMBOLS[2], 2),
];

const COHORTS = {
  synthetic: { id: "synthetic", name: "Synthetic plot", cells: fromRaster(SYNTHETIC_RASTER), synthetic: true },
  p0001: { id: "p0001", name: "P-0001 aggregate", cells: P0001, synthetic: false },
};

const cohortCodes = (id) => COHORTS[id].cells.map(codeOf);

return { CODE_COUNT, UNKNOWN, WATER, LAND, YEARS, STATE_NAMES, landCode, decisionCode, BLANKED, codeOf, describe, summarize, emptyCounts, histogram, SYNTHETIC_RASTER, COHORTS, cohortCodes };
})();

      const tube = tubes[token.code];
      if (!token.inside && token.z < INTO_TUBE) {
        token.inside = true;
        tube.slot.appendChild(token.slot.el);
      }
      if (token.z <= Z.glass0 + tube.height) {
        land(token);
        state.flying.splice(index, 1);
        continue;
      }
      placeToken(token);
    }
  }
  const clearOfSpout = () => state.flying.every((token) => token.z < LEFT_SPOUT);

  // ---- Head ---------------------------------------------------------------------------------------------------
  function startMove(target) {
    head.x0 = head.x;
    head.x1 = target;
    head.t = 0;
    head.T = 0.2 + Math.min(0.5, Math.abs(target - head.x) / 420);
    head.mode = "move";
  }
  function planNext() {
    if (state.n >= state.codes.length) {
      state.phase = "park";
      startMove(CFG.head.park);
      return;
    }
    const target = CFG.tubeX[state.codes[state.n]];
    if (Math.abs(target - head.x) < 0.05) {
      head.mode = "ready";
      head.wait = SAME_TUBE_GAP;
    } else startMove(target);
  }
  function release() {
    if (!spawn(state.codes[state.n])) return;
    state.n += 1;
    head.mode = "clear";
  }
  function stepHead(dt) {
    if (head.mode === "move") {
      head.t += dt;
      const u = clamp(head.t / head.T, 0, 1);
      head.x = head.x0 + (head.x1 - head.x0) * ease(u);
      if (u >= 1) {
        head.x = head.x1;
        head.mode = state.phase === "sort" ? "ready" : "idle";
        head.wait = 0;
      }
    } else if (head.mode === "delay") {
      head.wait -= dt;
      if (head.wait <= 0) {
        state.phase = "sort";
        planNext();
      }
    } else if (head.mode === "ready") {
      head.wait -= dt;
      if (head.wait <= 0) release();
    } else if (head.mode === "clear" && clearOfSpout()) planNext();
  }

  // ---- Phases --------------------------------------------------------------------------------------------------
  function loadCohort(id) {
    state.cohort = id;
    state.codes = CFG.cohorts[id].codes;
    state.cells = CFG.cohorts[id].cells;
    state.n = 0;
    cohortButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.cohort === id)));
  }
  function startSort(delay = 0.5) {
    state.phase = "start";
    state.sorted = false;
    stage.removeAttribute("data-sorted");
    head.mode = "delay";
    head.wait = delay;
    announce(`Sorting ${state.codes.length} cells into 20 tubes.`);
  }
  function startDrain() {
    state.phase = "drain";
    state.sorted = false;
    stage.removeAttribute("data-sorted");
    state.counts = MODEL.emptyCounts();
    state.n = 0;
    refreshSummary();
    for (const token of state.flying) {
      token.slot.busy = false;
      token.slot.el.style.display = "none";
      tokenLayer.appendChild(token.slot.el);
    }
    state.flying = [];
    startMove(CFG.head.park);
  }
  function finishSort() {
    state.phase = "hold";
    state.clock = 0;
    state.sorted = true;
    stage.setAttribute("data-sorted", "");
    announce(finalMessage());
  }
  function applyFinal() {
    // reduced motion: show the sorted state at once, no motion
    state.counts = MODEL.histogram(state.codes);
    state.n = state.codes.length;
    refreshSummary();
    for (const tube of tubes) {
      tube.shown = state.counts[tube.code];
      tube.height = Math.min(tube.shown, Z.capacity) * CELL_H;
      setDrums(tube.drums, tube.shown);
      drawPile(tube);
    }
    readings[0].shown = state.summary.forest;
    readings[1].shown = state.summary.lost;
    setDrums(readings[0].drums, readings[0].shown);
    setDrums(readings[1].drums, readings[1].shown);
    state.magazine.shown = 0;
    drawMagazine();
    head.x = CFG.head.park;
    for (const node of headNodes) node.setAttribute("transform", translateAlong(P, [head.x, 0, 0]));
    state.phase = "hold";
    state.sorted = true;
    stage.setAttribute("data-sorted", "");
    say();
  }
  function switchTo(id) {
    if (id === state.cohort && !state.pending) return;
    state.pending = id;
    state.playing = true;
    syncPlay();
    if (still.matches) {
      loadCohort(id);
      state.pending = null;
      applyFinal();
      return;
    }
    if (state.phase !== "drain") startDrain();
    run();
  }

  // ---- Frame --------------------------------------------------------------------------------------------------
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    const step = state.playing ? dt : 0;

    if (step > 0) {
      stepTokens(step);
      stepHead(step);
      if (state.phase === "park" && head.mode === "idle" && !state.flying.length) finishSort();
      else if (state.phase === "hold") {
        state.clock += step;
        if (state.clock > HOLD) startDrain();
      } else if (state.phase === "drain" && head.mode === "idle") {
        // wait for the tubes to empty, then load whatever comes next
        const empty = tubes.every((tube) => tube.shown < 0.05 && tube.height < 0.02) && state.magazine.shown > 0.98;
        if (empty) {
          if (state.pending) {
            loadCohort(state.pending);
            state.pending = null;
          } else state.n = 0;
          startSort(0.6);
        }
      }
    }

    // counters, piles and the magazine follow their targets
    for (const tube of tubes) {
      if (tube.hit > 0) {
        tube.hit -= step;
        if (tube.hit <= 0) tube.counter.removeAttribute("data-hit");
      }
      const target = state.counts[tube.code];
      if (step > 0 || tube.shown !== target) {
        tube.shown = follow(tube.shown, target, step || dt, state.phase === "drain" ? 0.12 : 0.09);
        tube.height = follow(tube.height, Math.min(target, Z.capacity) * CELL_H, step || dt, 0.07);
      }
      if (!tube.blank) setDrums(tube.drums, tube.shown);
      drawPile(tube);
    }
    const targets = [state.summary.forest, state.summary.lost];
    readings.forEach((reading, index) => {
      reading.shown = follow(reading.shown, targets[index], step || dt, 0.1);
      setDrums(reading.drums, reading.shown);
    });
    const remaining = state.phase === "drain" || state.phase === "start" ? 1 : 1 - state.n / state.codes.length;
    state.magazine.shown = follow(state.magazine.shown, state.phase === "park" || state.phase === "hold" ? 0 : remaining, step || dt, 0.2);
    drawMagazine();
    for (const node of headNodes) node.setAttribute("transform", translateAlong(P, [head.x, 0, 0]));
    say();

    const busy = !still.matches && (state.playing || tubes.some((tube) => Math.abs(tube.shown - state.counts[tube.code]) > 0.01));
    frame = visible && busy ? requestAnimationFrame(tick) : 0;
  }
  function run() {
    if (!frame && visible) {
      last = 0;
      frame = requestAnimationFrame(tick);
    }
  }

  // ---- Controls -----------------------------------------------------------------------------------------------
  function syncPlay() {
    playButton.textContent = state.playing ? "Pause" : "Play";
    playButton.setAttribute("aria-pressed", String(!state.playing));
  }
  function togglePlay() {
    if (still.matches) return;
    state.playing = !state.playing;
    syncPlay();
    say(true);
    run();
  }
  playButton.addEventListener("click", togglePlay);
  cohortButtons.forEach((button) => button.addEventListener("click", () => switchTo(button.dataset.cohort)));
  stage.addEventListener("click", togglePlay);
  stage.addEventListener("keydown", (event) => {
    if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      togglePlay();
    } else if (event.key === "s" || event.key === "S" || event.key === "ArrowRight" || event.key === "ArrowLeft") {
      event.preventDefault();
      switchTo(state.cohort === "synthetic" ? "p0001" : "synthetic");
    } else if (event.key === "1") switchTo("synthetic");
    else if (event.key === "2") switchTo("p0001");
  });
  new IntersectionObserver(
    (entries) => {
      visible = entries[entries.length - 1].isIntersecting;
      if (visible) run();
    },
    { rootMargin: "120px 0px" },
  ).observe(stage);

  // ---- Start --------------------------------------------------------------------------------------------------
  loadCohort("synthetic");
  refreshSummary();
  syncPlay();
  if (still.matches) {
    playButton.disabled = true;
    applyFinal();
  } else {
    for (const tube of tubes) setDrums(tube.drums, 0);
    readings.forEach((reading) => setDrums(reading.drums, 0));
    drawMagazine();
    say(true);
  }
  window.__sorter = { state, head, tubes };
})();
</script></body></html>
