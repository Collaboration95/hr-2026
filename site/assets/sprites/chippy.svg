<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="title desc">
<!-- Handmade on a 32 by 32 pixel grid. Each pose contains its complete drawing. -->
<title id="title">Chippy</title>
<desc id="desc">Chippy. A loyal little map cell with very exact standards. idle: "744,732 cells identical.". happy: "Every cell accounted for.". sad: "Please mind the pixels.". nod: "Same cells. I checked.". dizzy: "That was a lot of cells.".</desc>
<style>.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose="happy"] .pose[data-pose="happy"]{display:inline}
svg[data-pose="sad"] .pose[data-pose="sad"]{display:inline}
svg[data-pose="nod"] .pose[data-pose="nod"]{display:inline}
svg[data-pose="dizzy"] .pose[data-pose="dizzy"]{display:inline}
@media (prefers-reduced-motion: no-preference){

.pose[data-pose=idle] .eyes{animation:chippy-blink 4s steps(1,end) infinite;transform-origin:16px 16px}
.pose[data-pose=happy] .critter{animation:chippy-hop .8s steps(2,end) infinite}
.pose[data-pose=nod] .head{animation:chippy-nod 1.2s steps(2,end) infinite}
.pose[data-pose=dizzy] .critter{animation:chippy-wobble .6s steps(2,end) infinite}
.pose[data-pose=dizzy] .stars{animation:chippy-stars .6s steps(1,end) infinite}
@keyframes chippy-blink{0%,93%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.16)}}
@keyframes chippy-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes chippy-nod{0%,70%,100%{transform:translateY(0)}30%,50%{transform:translateY(2px)}}
@keyframes chippy-wobble{0%,100%{transform:translateX(-1px)}50%{transform:translateX(1px)}}
@keyframes chippy-stars{0%,100%{opacity:1}50%{opacity:.35}}

}</style>
