.iso{

  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;

  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.pr-hole{fill:var(--anatomy-hi);fill-opacity:.8;stroke:var(--anatomy-hi);stroke-width:.5}

.pr-hole[data-extra]{fill:var(--anatomy-lit);fill-opacity:1;stroke:var(--anatomy-lit);stroke-width:.9}
.pr-well{fill:var(--anatomy-shade-0);stroke:none}
.pr-streak{stroke-dasharray:3 9}
.pr-tape>.iso-shade{fill:var(--anatomy-shade-1)}
.pr-tape>.iso-fill{fill:var(--anatomy-shade-3)}
.pr-hit{fill:transparent;stroke:none;cursor:pointer;pointer-events:all}
.iso-solid.pr-lens[data-lit]>.iso-fill,.iso-solid.pr-lens[data-lit]>.iso-shade,.iso-solid.pr-lens[data-lit]>.iso-top{fill:var(--anatomy-paper)}
.iso-solid.pr-lens[data-on]>.iso-fill,.iso-solid.pr-lens[data-on]>.iso-shade,.iso-solid.pr-lens[data-on]>.iso-top{fill:var(--anatomy-lit)}
.pr-rays{opacity:0;transition:opacity 160ms var(--anatomy-ease)}
.pr-rays[data-on]{opacity:1}
.pr-rod[data-bad] .iso-edge{stroke:var(--anatomy-lit)}
.iso-stage{outline:none}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.pr-controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pr-controls button{font:inherit;font-size:12.5px;letter-spacing:.02em;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:2px;padding:6px 12px;cursor:pointer;box-shadow:var(--anatomy-lift)}
.pr-controls button:hover:not(:disabled){border-color:var(--anatomy-hi)}
.pr-controls button:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.pr-controls button:disabled{opacity:.4;cursor:default}
.pr-controls button[aria-pressed="true"]{border-color:var(--anatomy-hi)}
.pr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.iso-stage{overflow:hidden}.iso-stage .iso-svg{width:118%;max-width:none;margin-left:-9%}}
@media (prefers-reduced-motion:reduce){.pr-rays{transition:none}}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];

// The truth model of the every-cell proof. Pure: no DOM, no kit.
// the lever and the readout all read one source.

const FACTS = {
  cells: 744732, // cells in the 34 x 17 km sample region
  levels: ["screening", "decision"], // the proof ran at both levels
  plots: 17, // the 17 supplied plots, every output field
  fuzzed: 9829, // fuzzed polygons, identical on both paths
  codes: 20, // each Hansen cell becomes one of 20 codes
};

// Display pacing only. The proof is not timed by this figure.
const PACE = {
  scan: 93000, // cells per second while the run is shown sped up
  inspect: 12, // cells per second near a mismatch, slow enough to read the holes
  start: 6, // first rows of a run, slow enough to see
  grow: 5, // 1/s: how fast the shown rate climbs
  brake: 6, // 1/s: braking law toward a flipped cell, rate = brake x (cells left - lead)
  lead: 14, // cells shown at the inspect pace before the flipped cell arrives
};

const mix = (a, b) => {
  let h = (Math.imul(a ^ 0x9e3779b9, 2654435761) ^ Math.imul(b + 0x85ebca6b, 40503)) >>> 0;
  h ^= h >>> 15;
  h = Math.imul(h, 2246822519) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 3266489917) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
};

// Synthetic stand-in for a cell's code (0..19). The real codes are not shown.
const codeOf = (level, row) => mix(row, level + 1) % FACTS.codes;

// Track that "flip one cell" punches: the first track whose bit is 0, so the store gains one hole.
function flipBitOf(level, row) {
  const code = codeOf(level, row);
  for (let k = 0; k < 5; k++) {
    const bit = (row + k) % 5;
    if (!((code >> bit) & 1)) return bit;
  }
  return 0;
}

// The pattern punched on each tape at a row.
const patternOf = (level, row, lane, flip) => codeOf(level, row) | (lane === "store" && flip && flip.row === row ? 1 << flip.bit : 0);

// Per-track difference sensed by the comb at the head: -1 = original only, +1 = store only, 0 = same.
function senseAt(level, row, flip) {
  if (row < 0 || row >= FACTS.cells) return [0, 0, 0, 0, 0];
  const a = patternOf(level, row, "orig", flip);
  const b = patternOf(level, row, "store", flip);
  return [0, 1, 2, 3, 4].map((bit) => ((b >> bit) & 1) - ((a >> bit) & 1));
}

function newRun(level = 1) {
  return { level, i: 0, rate: 0, mode: "idle", flip: null };
}

// One step of the verifier. i is cells compared (continuous), the cell under the head is floor(i).
function step(run, dt) {
  const n = FACTS.cells;
  if (run.mode === "run") {
    let target = PACE.scan;
    if (run.flip) target = Math.min(PACE.scan, Math.max(PACE.inspect, PACE.brake * (run.flip.row - run.i - PACE.lead)));
    if (run.rate < PACE.start) run.rate = PACE.start;
    run.rate = run.rate > target ? Math.max(target, run.rate * Math.exp(-14 * dt)) : Math.min(target, run.rate * Math.exp(PACE.grow * dt));
    run.i += run.rate * dt;
    if (run.flip && run.i >= run.flip.row) {
      run.i = run.flip.row;
      run.rate = 0;
      run.mode = "tripped";
    } else if (run.i >= n) {
      run.i = n;
      run.rate = 0;
      run.mode = "done";
    }
  } else {
    run.rate = run.rate > 0.4 ? run.rate * Math.exp(-9 * dt) : 0;
    if (run.rate > 0) run.i = Math.min(run.flip ? run.flip.row : n, run.i + run.rate * dt * 0.1);
  }
  return run;
}

// Punch one extra hole into the store tape ahead of the head. Returns false if nothing can be punched.
function flipOne(run) {
  if (run.flip || (run.mode !== "idle" && run.mode !== "run" && run.mode !== "paused")) return false;
  const here = Math.floor(run.i);
  if (here > FACTS.cells - 200) return false;
  const away = run.rate > PACE.inspect ? Math.ceil((run.rate - PACE.inspect) / PACE.brake) + PACE.lead + 3 : 10;
  const row = Math.min(FACTS.cells - 2, here + away);
  run.flip = { row, bit: flipBitOf(run.level, row) };
  return true;
}

const fmt = (n) => Math.floor(n).toLocaleString("en-US");

function readoutOf(run, sped) {
  const level = FACTS.levels[run.level];
  const count = `${fmt(run.i)} / ${fmt(FACTS.cells)}`;
  if (run.mode === "tripped") return `${level} · ${count} · cell ${fmt(run.flip.row + 1)} differs`;
  if (run.mode === "done") return `${level} · ${count} · all identical`;
  if (run.flip && run.mode !== "paused") return `${level} · ${count} · cell ${fmt(run.flip.row + 1)} flipped`;
  if (run.mode === "idle") return `${level} · ${count} · ready`;
  if (run.mode === "paused") return `${level} · ${count} · paused`;
  return `${level} · ${count} · identical${sped ? ", sped up" : ""}`;
}

const TAU = Math.PI * 2;
const lim = (v, a, b) => Math.min(b, Math.max(a, v));

function tangentOf(c1, r1, c2, r2) {

  for (let k = 0; k < 3; k++) {
    const a = theta + (k * TAU) / 3;
    d += lineOnTop([cx + 2.2 * Math.cos(a), cy + 2.2 * Math.sin(a)], [cx + (C.HUB_R - 0.1) * Math.cos(a), cy + (C.HUB_R - 0.1) * Math.sin(a)], z, P);
  }
  return lineSvg(d, { tone: "lo" });
}

// The tape as a path: arc length s runs along its centre line, s = 0 at the reading head.
function ribbonModel(lane, progress) {
  const points = ribbonLine(lane, progress);
  const cum = [0];
  for (let k = 1; k < points.length; k++) cum.push(cum[k - 1] + Math.hypot(points[k][0] - points[k - 1][0], points[k][1] - points[k - 1][1]));
  return { points, cum, head: cum[7] + C.POST_X, total: cum[cum.length - 1] };
}
function onRibbon(model, s) {
  const at = s + model.head;
  if (at < 0 || at > model.total) return null;
  let k = 1;
  while (k < model.cum.length - 1 && model.cum[k] < at) k++;
  const a = model.points[k - 1];
  const b = model.points[k];
  const len = model.cum[k] - model.cum[k - 1] || 1;
  const u = (at - model.cum[k - 1]) / len;
  const t = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
  return { p: [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u], t, edge: Math.min(at, model.total - at) };
}
function holeRing(spot, z, r, steps) {
  const face = C.TT / 2 + 0.06;
  const cx = spot.p[0] - spot.t[1] * face;
  const cy = spot.p[1] + spot.t[0] * face;
  const points = [];
  for (let n = 0; n < steps; n++) {
    const a = (n / steps) * TAU;
    const u = r * Math.cos(a);
    points.push(iso([cx + spot.t[0] * u, cy + spot.t[1] * u, z + r * Math.sin(a)], P));
  }
  return pathOf(points, true);
}
// Holes of one tape, following the tape round the posts and onto the reels. vis is the row under the head.
function holesMarkup(level, lane, vis, flip, progress) {
  const model = ribbonModel(lane, progress);
  const lo = Math.ceil(vis - (model.total - model.head) / C.PITCH);
  const hi = Math.floor(vis + model.head / C.PITCH);
  let data = "";
  let feed = "";
  let extra = "";
  let faded = "";
  for (let r = lo; r <= hi; r++) {
    if (r < 0 || r >= C.N) continue;
    const spot = onRibbon(model, (vis - r) * C.PITCH);
    if (!spot) continue;
    const alpha = ease3(3, 14, spot.edge);
    if (alpha < 0.03) continue;
    let d = "";
    let f = holeRing(spot, FEED_Z, C.FEED_R, 8);
    const code = codeOf(level, r);
    for (let bit = 0; bit < 5; bit++) {
      if ((code >> bit) & 1) d += holeRing(spot, bitZ(bit), C.HOLE_R, 10);
      else if (lane === "store" && flip && flip.row === r && flip.bit === bit) extra += holeRing(spot, bitZ(bit), C.HOLE_R + 0.15, 12);
    }
    if (alpha > 0.97) {
      data += d;
      feed += f;
    } else faded += `<g opacity="${alpha.toFixed(2)}"><path class="pr-hole" d="${d}"/><path class="pr-hole" data-feed d="${f}"/></g>`;
  }
  return `<path class="pr-hole" d="${data}"/><path class="pr-hole" data-feed d="${feed}"/>${faded}<path class="pr-hole" data-extra d="${extra}"/>`;
}
// Motion blur: the six tracks as flowing dashes along the tape.
function streakMarkup(lane, progress) {
  const model = ribbonModel(lane, progress);
  const face = C.TT / 2 + 0.06;
  let d = "";
  SLOT_Z.forEach((z) => {
    const run = [];
    for (let s = -model.head + 3; s <= model.total - model.head - 3; s += 3) {
      const spot = onRibbon(model, s);
      run.push(iso([spot.p[0] - spot.t[1] * face, spot.p[1] + spot.t[0] * face, z], P));
    }
    d += pathOf(run);
  });
  return lineSvg(d, { tone: "lo", flow: true, className: "pr-streak", free: true });
}

// Stop lever: a horizontal arm on a vertical pivot. open = 1: pawl clear of the ratchet, 0: seated.
function leverGeometry(open) {
  const [px, py] = C.PIVOT;
  const [rx, ry] = C.RATCHET;
  const base = Math.atan2(ry - py, rx - px);
  const reach = Math.hypot(rx - px, ry - py) - C.RATCHET_R;
  const angle = base + C.LEVER_OPEN * open;
  const a = [Math.cos(angle), Math.sin(angle)];
  const b = [-a[1], a[0]];
  const at = (s, t) => [px + a[0] * s + b[0] * t, py + a[1] * s + b[1] * t];
  return { ring: [at(-11, -2.7), at(reach - 4, -2.7), at(reach, -0.9), at(reach, 0.9), at(reach - 4, 2.7), at(-11, 2.7)], tail: [...at(-8, 0), C.LEVER_Z + 2.6], tip: at(reach, 0) };
}
function leverMarkup(open) {
  const g = leverGeometry(open);
  return solidSvg(extrude(g.ring, C.LEVER_Z, 2.6, P, { convex: true, bevel: 0.3 }), { tone: "hi", crease: "faint" }) + dotsSvg([iso(g.tail, P)], { size: 0.8, tone: "hi" });
}

function ratchetMarkup(theta) {
  const [cx, cy] = C.RATCHET;
  const t = radialTicks(cx, cy, C.RATCHET_R, 20, 5, C.RATCHET_H, [1.7, 2.7], P, theta);
  return lineSvg(t.minor, { tone: "lo" }) + lineSvg(t.major, { tone: "mid" });
}

// The trip cord: from the comparator plate to the lever's tail. Taut while the rods agree, slack once tripped.
function cordMarkup(slack, plateY, open) {
  const g = leverGeometry(open);
  const from = [0, plateY, C.PLATE_TOP + 0.2];
  const to = g.tail;
  const points = [];
  for (let k = 0; k <= 10; k++) {
    const t = k / 10;
    const sag = slack * 7 * 4 * t * (1 - t);
    points.push(iso([from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t, from[2] + (to[2] - from[2]) * t - sag], P));
  }
  return wireSvg(points[0], points[10], { via: points.slice(1, 10), tone: "mid", size: 0.8 });
}

// The odometer: six wheels in the face plane of the housing. A wheel that turns too fast to read
// shows a smear of digits instead of its true position.
function counterMarkup(i, rate, clock) {
  const K = C.CTR;
  const height = K.v1 - K.v0;
  const mid = (K.v0 + K.v1) / 2;
  const total = 6 * K.ww + K.gap;
  let u = (K.x0 + K.x1) / 2 - total / 2;
  let out = "";
  for (let w = 0; w < 6; w++) {
    const power = 5 - w;
    const unit = Math.pow(10, power);
    let pos;
    if (power === 0) pos = i;
    else {
      const lower = i / (unit / 10);
      pos = Math.floor(i / unit) + ease3(9, 10, lower - 10 * Math.floor(lower / 10));
    }
    const blur = ease3(5, 16, rate / unit);
    if (blur > 0.5) pos = clock * (22 + w * 3) + w * 2.3;
    const whole = Math.floor(pos);
    const f = pos - whole;
    const now = ((whole % 10) + 10) % 10;
    const next = (now + 1) % 10;
    const cx = u + K.ww / 2;
    const fade = (1 - 0.5 * blur).toFixed(2);
    const y0 = mid + K.fs * 0.36 - f * height;
    out += `<g opacity="${fade}"><text class="iso-face-text" data-tone="hi" x="${cx.toFixed(2)}" y="${y0.toFixed(2)}" font-size="${K.fs}" text-anchor="middle">${now}</text><text class="iso-face-text" data-tone="hi" x="${cx.toFixed(2)}" y="${(y0 + height).toFixed(2)}" font-size="${K.fs}" text-anchor="middle">${next}</text></g>`;
    u += K.ww + (w === 2 ? K.gap : 0);
  }
  return out;
}

// Live behaviour. One loop: it steps the model (model.mjs), then writes the DOM from it.
const stage = document.querySelector("[data-stage]");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const announcer = document.querySelector("[data-live]");
const buttons = Object.fromEntries([...document.querySelectorAll(".pr-controls button")].map((b) => [b.dataset.act, b]));
const parts = {};
svg.querySelectorAll("[data-part]").forEach((node) => (parts[node.dataset.part] = node));
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LANES = ["orig", "store"];
const SHIFT = 2.4; // how far a rod slides toward the tape that has the extra hole

const run = newRun(1);
let clock = 0;
let vis = 0; // where the tape is drawn, in cells (follows run.i, smeared while it moves too fast to read)
let blur = 0;
let open = 1; // stop lever: 1 clear of the ratchet, 0 seated
let sliderX = 1;
let pressed = 0;
const rods = [0, 0, 0, 0, 0];
let builtP = -1;
let builtVis = null;
let builtHoles = -1;
let builtFlip = null;
let builtLevel = null;
let lastCounter = "";
let lastTips = "";
let lastText = "";
let lastBar = "";
let lastMode = "idle";
let lampOn = false;

const tour = { on: !still.matches, phase: 0, t: 0, quiet: 0 };
let frame = 0;
let last = 0;
let visible = false;

const settleTo = (value, target, dt, seconds) => (Math.abs(target - value) < 0.002 ? target : value + (target - value) * (1 - Math.exp(-dt / seconds)));

function announce(text) {
  announcer.textContent = text;
}

function calmFinish() {
  if (!still.matches || run.mode !== "run") return;
  if (run.flip) {
    run.i = run.flip.row;
    run.mode = "tripped";
  } else {
    run.i = C.N;
    run.mode = "done";
  }
  run.rate = 0;
}

const act = {
  run() {
    if (run.mode === "run") {
      run.mode = "paused";
      announce("Comparison paused");
    } else {
      if (run.mode === "done" || run.mode === "tripped") act.reset(true);
      run.mode = "run";
      announce("Comparison running, sped up");
      calmFinish();
    }
  },
  flip() {
    if (flipOne(run)) {
      announce(`One extra hole punched into the store tape at cell ${fmt(run.flip.row + 1)}`);
      calmFinish();
    }
  },
  reset(quiet) {
    run.i = 0;
    run.rate = 0;
    run.mode = "idle";
    run.flip = null;
    vis = 0;
    if (!quiet) announce("Reset");
  },
  level() {
    run.level = 1 - run.level;
    act.reset(true);
    announce(`Level: ${FACTS.levels[run.level]}`);
  },
};

function touched() {
  tour.on = false;
  tour.quiet = 7;
}

function tourStep(dt) {
  if (!tour.on) {
    if (tour.quiet > 0 && !still.matches) {
      tour.quiet -= dt;
      if (tour.quiet <= 0) {
        tour.on = true;
        tour.phase = 0;
        tour.t = 0;
      }
    }
    return;
  }
  tour.t += dt;
  if (tour.phase === 0) {
    act.reset(true);
    act.run();
    tour.phase = 1;
    tour.t = 0;
  } else if (tour.phase === 1 && run.mode === "done") {
    tour.phase = 2;
    tour.t = 0;
  } else if (tour.phase === 2 && tour.t > 2.8) {
    act.reset(true);
    act.run();
    tour.phase = 3;
    tour.t = 0;
  } else if (tour.phase === 3 && tour.t > 3.2) {
    act.flip();
    tour.phase = 4;
    tour.t = 0;
  } else if (tour.phase === 4 && run.mode === "tripped") {
    tour.phase = 5;
    tour.t = 0;
  } else if (tour.phase === 5 && tour.t > 4.2) {
    tour.phase = 0;
  }
}

function rebuildReels(p) {
  for (const lane of LANES) {
    parts[`ribbon-${lane}`].innerHTML = ribbonMarkup(lane, p);
    parts[`streak-${lane}`].innerHTML = streakMarkup(lane, p);
    for (const side of ["supply", "take"]) parts[`pack-${lane}-${side}`].innerHTML = packMarkup(lane, side, p);
  }
}

function draw(dt) {
  const calm = still.matches;
  // where the tape is drawn
  const lag = Math.abs(run.i - vis);
  const fast = ease3(14, 70, run.rate);
  const smear = Math.max(fast, ease3(1.5, 6, lag));
  vis = calm ? run.i : vis + (run.i - vis) * (1 - Math.exp(-dt / (0.025 + 0.2 * smear)));
  if (Math.abs(run.i - vis) < 0.002) vis = run.i;
  blur = calm ? 0 : Math.max(fast, ease3(1.5, 6, Math.abs(run.i - vis)));

  // reels and tape
  const p = Math.round((run.i / C.N) * 4096) / 4096;
  if (p !== builtP) {
    rebuildReels(p);
    builtP = p;
  }
  if (blur < 0.98 && (vis !== builtVis || builtFlip !== run.flip || builtLevel !== run.level || builtHoles !== p)) {
    for (const lane of LANES) parts[`holes-${lane}`].innerHTML = holesMarkup(run.level, lane, vis, run.flip, p);
    builtVis = vis;
    builtFlip = run.flip;
    builtLevel = run.level;
    builtHoles = p;
  }
  const radii = packRadii(p);
  for (const lane of LANES) {
    parts[`holes-${lane}`].setAttribute("opacity", (1 - blur).toFixed(2));
    parts[`streak-${lane}`].style.opacity = (blur * 0.9).toFixed(2);
    for (const side of ["supply", "take"]) {
      const theta = ((vis * C.PITCH) / radii[side]) % (Math.PI * 2);
      const spokes = parts[`spokes-${lane}-${side}`];
      spokes.innerHTML = spokesMarkup(lane, side, theta);
      spokes.setAttribute("opacity", (1 - 0.9 * blur).toFixed(2));
    }
  }

  // the comb: five rods slide toward whichever tape holds the extra hole
  const sense = senseAt(run.level, Math.round(vis), run.flip);
  let plate = 0;
  let tips = "";
  for (let bit = 0; bit < 5; bit++) {
    rods[bit] = calm ? sense[bit] * SHIFT : settleTo(rods[bit], sense[bit] * SHIFT, dt, 0.05);
    const move = translateAlong(P, [0, rods[bit], 0]);
    for (const half of ["back", "front"]) {
      const node = parts[`rod-${half}-${bit}`];
      node.setAttribute("transform", move);
      if (Math.abs(rods[bit]) > 0.6) node.setAttribute("data-bad", "");
      else node.removeAttribute("data-bad");
    }
    if (Math.abs(rods[bit]) > Math.abs(plate)) plate = rods[bit];
    if (rods[bit] > 1.2) tips += dotsSvg([iso([0, faceY("store") + 0.1, bitZ(bit)], P)], { size: 1.15, tone: "hi" });
  }
  const plateY = Math.sign(plate) * Math.max(0, Math.abs(plate) - 0.5);
  parts.plate.setAttribute("transform", translateAlong(P, [0, plateY, 0]));
  if (tips !== lastTips) {
    parts["tips-store"].innerHTML = tips;
    lastTips = tips;
  }

  // stop lever, cord, ratchet, lamp
  const tripped = run.mode === "tripped";
  const before = open;
  open = calm ? (tripped ? 0 : 1) : settleTo(open, tripped ? 0 : 1, dt, tripped ? 0.07 : 0.3);
  if (open !== before || !parts.lever.firstChild) {
    parts.lever.innerHTML = leverMarkup(open);
  }
  parts.cord.innerHTML = cordMarkup(1 - open, plateY, open);
  const ratchet = parts.ratchet;
  ratchet.innerHTML = ratchetMarkup((vis * 0.55) % (Math.PI * 2));
  ratchet.setAttribute("opacity", (1 - 0.9 * blur).toFixed(2));
  const on = tripped && open < 0.35;
  if (on !== lampOn) {
    lampOn = on;
    const lens = parts.lamp.firstChild;
    if (on) lens.setAttribute("data-on", "");
    else lens.removeAttribute("data-on");
    if (on) parts.rays.setAttribute("data-on", "");
    else parts.rays.removeAttribute("data-on");
  }

  // odometer
  const counter = counterMarkup(run.i, calm ? 0 : run.rate, clock);
  if (counter !== lastCounter) {
    parts.counter.innerHTML = counter;
    lastCounter = counter;
  }

  // controls
  pressed = calm ? (run.mode === "run" ? 1 : 0) : settleTo(pressed, run.mode === "run" ? 1 : 0, dt, 0.06);
  parts["button-run"].setAttribute("transform", translateAlong(P, [0, 0, -1.2 * pressed]));
  const glyphs = parts["button-run"].querySelectorAll("[data-glyph]");
  glyphs.forEach((node) => (node.style.display = (node.dataset.glyph === "pause") === (run.mode === "run") ? "" : "none"));
  sliderX = calm ? run.level : settleTo(sliderX, run.level, dt, 0.09);
  parts.slider.setAttribute("transform", translateAlong(P, [sliderX * (C.SLIDER.right - C.SLIDER.left), 0, 0]));

  // readout and buttons
  const sped = run.mode === "run" && run.rate > 400 && !calm;
  const text = readoutOf(run, sped);
  if (text !== lastText) {
    readout.textContent = text;
    stage.setAttribute("aria-valuetext", text);
    lastText = text;
  }
  const bar = [run.mode, run.flip ? 1 : 0, run.level, run.i > C.N - 200 ? 1 : 0].join();
  if (bar !== lastBar) {
    lastBar = bar;
    buttons.run.textContent = run.mode === "run" ? "Pause" : run.mode === "done" || run.mode === "tripped" ? "Run again" : run.mode === "paused" ? "Resume" : "Run";
    buttons.flip.disabled = !(run.mode === "idle" || run.mode === "run" || run.mode === "paused") || !!run.flip || run.i > C.N - 200;
    buttons.level.textContent = `Level: ${FACTS.levels[run.level]}`;
  }
  if (run.mode !== lastMode) {
    if (run.mode === "tripped") announce(`Stopped at cell ${fmt(run.flip.row + 1)}: the holes differ, lamp lit`);
    if (run.mode === "done") announce("All 744,732 cells identical");
    lastMode = run.mode;
  }

  const settled = run.mode !== "run" && vis === run.i && !tour.on && tour.quiet <= 0 && Math.abs(open - (tripped ? 0 : 1)) < 0.002 && rods.every((r, bit) => r === sense[bit] * SHIFT) && Math.abs(pressed - (run.mode === "run" ? 1 : 0)) < 0.002 && sliderX === run.level && run.rate === 0;
  return !settled;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  tourStep(dt);
  step(run, dt);
  const more = draw(dt);
  frame = visible && more ? requestAnimationFrame(tick) : 0;
}
const go = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) go();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

function press(name) {
  touched();
  if (act[name]) act[name]();
  go();
}
document.querySelector(".pr-controls").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (button && !button.disabled) press(button.dataset.act);
});
svg.addEventListener("click", (event) => {
  const hit = event.target.closest("[data-hit]");
  if (hit) press(hit.dataset.hit);
});
stage.addEventListener("keydown", (event) => {
  const key = event.key.toLowerCase();
  const name = key === " " || key === "enter" ? "run" : key === "f" ? "flip" : key === "r" ? "reset" : key === "l" ? "level" : null;
  if (!name) return;
  event.preventDefault();
  press(name);
});
if (still.matches) tour.on = false;
draw(0);
</script></body></html>
