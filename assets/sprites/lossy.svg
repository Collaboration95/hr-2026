<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="title desc">
<!-- Handmade on a 32 by 32 pixel grid. Each pose contains its complete drawing. -->
<title id="title">Lossy</title>
<desc id="desc">Lossy. A smudgy map-cell twin, grumpy about exactness but harmless. idle: "Close enough. Probably.". sad: "They noticed the missing bits.". happy: "Fine. That does look better.". shrug: "A few pixels. Who counts?". crossed-out: "Apparently, every pixel counts.".</desc>
<style>.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose="sad"] .pose[data-pose="sad"]{display:inline}
svg[data-pose="happy"] .pose[data-pose="happy"]{display:inline}
svg[data-pose="shrug"] .pose[data-pose="shrug"]{display:inline}
svg[data-pose="crossed-out"] .pose[data-pose="crossed-out"]{display:inline}
@media (prefers-reduced-motion: no-preference){

.pose[data-pose=idle] .fuzz{animation:lossy-fuzz .8s steps(1,end) infinite}
.pose[data-pose=sad] .critter{animation:lossy-sigh 2.4s steps(2,end) infinite}
.pose[data-pose=happy] .critter{animation:lossy-grudging 1.8s steps(2,end) infinite}
.pose[data-pose=shrug] .critter{animation:lossy-shrug 1.6s steps(2,end) infinite}
@keyframes lossy-fuzz{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes lossy-sigh{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes lossy-grudging{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-1px)}}
@keyframes lossy-shrug{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

}</style>
