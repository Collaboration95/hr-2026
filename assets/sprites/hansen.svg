<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="hansen-title hansen-desc">
<!-- Hand-built 32 by 32 pixel sprite; each pose contains its complete drawing. -->
<title id="hansen-title">Hansen, the forest ranger owl</title>
<desc id="hansen-desc">Hansen is a patient green-hatted owl who keeps binoculars close and forest history closer. idle: "Forest history, field glasses ready.". happy: "A clear view helps.". sad: "That deserves a closer look.". look: "Checking the forest-loss layer.". wave: "Hello from the canopy.".</desc>
<style>
.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose=happy] .pose[data-pose=happy]{display:inline}
svg[data-pose=sad] .pose[data-pose=sad]{display:inline}
svg[data-pose=look] .pose[data-pose=look]{display:inline}
svg[data-pose=wave] .pose[data-pose=wave]{display:inline}
@media (prefers-reduced-motion: no-preference){
.pose[data-pose=idle] .owl{animation:hansen-breathe 2.4s steps(2,end) infinite}
.pose[data-pose=happy] .owl{animation:hansen-hop .65s steps(2,end) infinite}
.pose[data-pose=look] .owl{animation:hansen-scan 2s steps(3,end) infinite}
.pose[data-pose=wave] .wave-wing{animation:hansen-wave .6s steps(2,end) infinite;transform-origin:26px 19px}
@keyframes hansen-breathe{50%{transform:translateY(1px)}}
@keyframes hansen-hop{50%{transform:translateY(-2px)}}
@keyframes hansen-scan{33%{transform:translateX(-1px)}66%{transform:translateX(1px)}}
@keyframes hansen-wave{50%{transform:rotate(15deg)}}
}
</style>
