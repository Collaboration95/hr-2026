<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="pip-title pip-desc">
<!-- Hand-drawn 32 by 32 pixel grid. Every pose contains its complete drawing. -->
<title id="pip-title">Pip</title>
<desc id="pip-desc">Pip. An earnest, slightly nervous sapling in a very serious yellow hard hat. idle: &quot;I brought my serious hat.&quot;. happy: &quot;A little room to grow.&quot;. sad: &quot;That leaf was important.&quot;. wave: &quot;Hello. Mind the roots.&quot;. dance: &quot;Strictly professional leaf wiggling.&quot;. clipboard: &quot;Let me check that leaf.&quot;.</desc>
<style>
.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose=happy] .pose[data-pose=happy]{display:inline}
svg[data-pose=sad] .pose[data-pose=sad]{display:inline}
svg[data-pose=wave] .pose[data-pose=wave]{display:inline}
svg[data-pose=dance] .pose[data-pose=dance]{display:inline}
svg[data-pose=clipboard] .pose[data-pose=clipboard]{display:inline}
@media (prefers-reduced-motion: no-preference){
@keyframes pip-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes pip-dance{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,-1px)}50%{transform:translate(0,-1px)}75%{transform:translate(1px,-1px)}}
.pose[data-pose=idle] .critter{animation:pip-bob 2s steps(2,end) infinite}
.pose[data-pose=happy] .critter{animation:pip-bob .8s steps(2,end) infinite}
.pose[data-pose=wave] .critter{animation:pip-bob .7s steps(2,end) infinite}
.pose[data-pose=dance] .critter{animation:pip-dance .8s steps(1,end) infinite}
}
</style>
