<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="jrc-title jrc-desc">
<!-- Hand-built 32 by 32 pixel sprite; each pose contains its complete drawing. -->
<title id="jrc-title">JRC, the blue-beret owl</title>
<desc id="jrc-desc">JRC is Hansen's inquisitive blue cousin, inspecting the 2020 forest layer one detail at a time. idle: "The 2020 forest layer, ready.". happy: "Details make my day.". sad: "This detail needs care.". look: "A little closer, please.". wave: "Bonjour from the branches.".</desc>
<style>
.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose=happy] .pose[data-pose=happy]{display:inline}
svg[data-pose=sad] .pose[data-pose=sad]{display:inline}
svg[data-pose=look] .pose[data-pose=look]{display:inline}
svg[data-pose=wave] .pose[data-pose=wave]{display:inline}
@media (prefers-reduced-motion: no-preference){
.pose[data-pose=idle] .owl{animation:jrc-breathe 2.4s steps(2,end) infinite}
.pose[data-pose=happy] .owl{animation:jrc-hop .65s steps(2,end) infinite}
.pose[data-pose=look] .owl{animation:jrc-scan 2s steps(3,end) infinite}
.pose[data-pose=wave] .wave-wing{animation:jrc-wave .6s steps(2,end) infinite;transform-origin:26px 19px}
@keyframes jrc-breathe{50%{transform:translateY(1px)}}
@keyframes jrc-hop{50%{transform:translateY(-2px)}}
@keyframes jrc-scan{33%{transform:translateX(-1px)}66%{transform:translateX(1px)}}
@keyframes jrc-wave{50%{transform:rotate(15deg)}}
}
</style>
