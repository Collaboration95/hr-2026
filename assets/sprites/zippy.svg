<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="zippy-title zippy-desc">
<!-- Hand-built 32 by 32 pixel sprite; each pose contains its complete drawing. -->
<title id="zippy-title">Zippy, the stopwatch bunny</title>
<desc id="zippy-desc">Zippy is a tiny bunny with oversized ambitions and a very small stopwatch. idle: "Ready when your plots are.". sprint: "44x faster re-checks of registered plots.". happy: "Small paws. Quick checks.". sad: "Start-up time dominates.". sleep: "Wake me for the next re-check.".</desc>
<style>
.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose=sprint] .pose[data-pose=sprint]{display:inline}
svg[data-pose=happy] .pose[data-pose=happy]{display:inline}
svg[data-pose=sad] .pose[data-pose=sad]{display:inline}
svg[data-pose=sleep] .pose[data-pose=sleep]{display:inline}
@media (prefers-reduced-motion: no-preference){
.pose[data-pose=idle] .bunny{animation:zippy-bob 1.8s steps(2,end) infinite}
.pose[data-pose=sprint] .bunny{animation:zippy-run .24s steps(2,end) infinite}
.pose[data-pose=sprint] .speed,.pose[data-pose=sprint] .leg-blur{animation:zippy-flash .18s steps(2,end) infinite}
.pose[data-pose=happy] .bunny{animation:zippy-bob .55s steps(2,end) infinite}
.pose[data-pose=sleep] .snooze{animation:zippy-bob 2s steps(2,end) infinite}
@keyframes zippy-bob{50%{transform:translateY(-1px)}}
@keyframes zippy-run{50%{transform:translateY(-1px) rotate(-2deg);transform-origin:17px 24px}}
@keyframes zippy-flash{50%{opacity:.35}}
}
</style>
