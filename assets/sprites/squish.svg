<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" data-pose="idle" role="img" aria-labelledby="title desc">
<!-- Handmade on a 32 by 32 pixel grid. Each pose contains its complete drawing. -->
<title id="title">Squish</title>
<desc id="desc">Squish. A sleepy data slab delighted to travel light. idle: "I packed absolutely everything.". squish: "99% smaller. Same important bits.". happy: "623 KB to 6.1 KB.". sad: "My suitcase was rather heavy.". sleep: "Wake me for the re-check.".</desc>
<style>.pose{display:none}
svg[data-pose=idle] .pose[data-pose=idle]{display:inline}
svg[data-pose="squish"] .pose[data-pose="squish"]{display:inline}
svg[data-pose="happy"] .pose[data-pose="happy"]{display:inline}
svg[data-pose="sad"] .pose[data-pose="sad"]{display:inline}
svg[data-pose="sleep"] .pose[data-pose="sleep"]{display:inline}
@media (prefers-reduced-motion: no-preference){

.pose[data-pose=idle] .tile{animation:squish-breathe 3s steps(2,end) infinite;transform-origin:16px 27px}
.pose[data-pose=squish] .tile{animation:squish-compress 3.6s steps(4,end) infinite;transform-origin:16px 27px}
.pose[data-pose=squish] .spark{animation:squish-spark 3.6s steps(1,end) infinite}
.pose[data-pose=happy] .tile{animation:squish-cheer .9s steps(2,end) infinite}
.pose[data-pose=sleep] .snore{animation:squish-snore 2s steps(2,end) infinite}
@keyframes squish-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
@keyframes squish-compress{0%,18%{transform:scale(1.8,1.6)}36%{transform:scale(1.8,.45)}48%{transform:scale(.8,1.2)}60%,100%{transform:scale(1)}}
@keyframes squish-spark{0%,48%{opacity:0}60%,100%{opacity:1}}
@keyframes squish-cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes squish-snore{0%,100%{transform:translateY(1px);opacity:.4}50%{transform:translateY(-1px);opacity:1}}

}</style>
